<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator - CodeAlpha</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; }
        button { background-color: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background-color: #0ea5e9; }
        .output-box { margin-top: 25px; padding: 15px; background: #0f172a; border-radius: 6px; font-family: monospace; font-size: 18px; color: #4ade80; min-height: 40px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 AI Music Generator</h1>
        <p>Click the button below to generate a new sequence of AI musical notes using an LSTM Neural Network.</p>
        <button onclick="generateMusic()">Generate Music Notes</button>
        <div class="output-box" id="result">Click generate to start...</div>
    </div>

    <script>
        async function generateMusic() {
            document.getElementById("result").innerText = "Generating notes...";
            try {
                let response = await fetch('/generate');
                let data = await response.json();
                document.getElementById("result").innerText = "Generated Sequence: [" + data.notes.join(", ") + "]";
            } catch (error) {
                document.getElementById("result").innerText = "Error generating music.";
            }
        }
    </script>
</body>
</html>
